[package]
name = "browser-history-search"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["src-tauri"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
futures-util = "0.3"
futures = "0.3"

# Database connections
rusqlite = { version = "0.31", features = ["bundled"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Browser history parsing
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async traits
async-trait = "0.1"

# File watching for auto-updates
notify = "6.1"

# HTTP client for FalkorDB and Zep
reqwest = { version = "0.11", features = ["json"] }

# Utilities
once_cell = "1.19"
dashmap = "5.5"
rayon = "1.8"
home = "0.5"
uuid = { version = "1.6", features = ["v4", "serde"] }

# NLP and Semantic Search
whatlang = "0.16"
rust-stemmers = "1.2"
unicode-segmentation = "1.10"
ordered-float = "4.0"
ndarray = "0.15"
regex = "1.10"

# Gmail API and OAuth2
oauth2 = "4.4"
base64 = "0.22"
urlencoding = "2.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = "symbols"
